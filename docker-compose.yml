services:
  db:
    image: postgres:17.0
    restart: always
    container_name: optcgl_project
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=optcgl_postgres_test
    volumes:
      - postgres:/data/postgres
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: optcgl_pgadmin-container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
volumes:
  postgres:
